name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:pages
      - run: npm run build:extension
      - run: cd dist-pages && zip -r ../need-this-later-pwa.zip .
      - run: cd dist-extension && zip -r ../need-this-later-extension.zip .
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            need-this-later-pwa.zip
            need-this-later-extension.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: I Need This Later ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --manifest-path src-tauri/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk need-this-later-android-unsigned.apk
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: need-this-later-android-unsigned.apk
