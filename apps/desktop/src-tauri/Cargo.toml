[package]
name = "need-this-later"
version = "1.0.0"
description = "A private universal inbox for everything you will need later"
authors = ["I Need This Later contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "need_this_later_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
